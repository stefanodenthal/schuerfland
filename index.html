<style>

<style>
/* Layout: full-screen top-down island canvas; HUD chips on top with the current goal and a gear button; bottom sheet for workbench and order board; overlay cards for menu, settings and welcome-back */
:root{
  --sea:#2f9cc4; --grass:#7ccf5a; --wood:#a0662f; --stone:#9aa0a8; --gold:#ffd34d; --ink:#23301f; --paper:#fff8e8; --muted:#6b7a63; --mint:#3fcf8e; --red:#d9483b;
  --f-display:"Lilita One","Arial Black",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sea);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.row{display:flex;align-items:center;gap:8px}
.chip{background:rgba(255,248,232,.94);border-radius:999px;padding:5px 12px;font-weight:900;font-size:16px;box-shadow:0 3px 0 rgba(35,48,31,.25);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.bump{animation:bump .22s ease-out}
@keyframes bump{50%{transform:scale(1.15)}}
.coin{display:inline-block;width:.85em;height:.85em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0 0 18%,var(--gold) 45%,#d9a516 100%);box-shadow:inset 0 -2px 0 #b8860b;vertical-align:-.08em;margin-right:.3em}
#bag.full{background:#ffd9d2;color:#b3261e}
#saved{flex:1;min-width:0;overflow:hidden;text-align:center;font-size:12px;font-weight:900;color:#fff;opacity:0;transition:opacity .35s;text-shadow:0 1px 2px rgba(0,0,0,.45);white-space:nowrap}
#saved.on{opacity:1}
#gear{pointer-events:auto;flex:none;width:36px;height:36px;border-radius:50%;background:rgba(255,248,232,.94);color:var(--ink);box-shadow:0 3px 0 rgba(35,48,31,.25);display:flex;align-items:center;justify-content:center;padding:0}
#gear svg{width:22px;height:22px}
#goal{align-self:center;background:rgba(35,48,31,.84);color:var(--paper);border-radius:12px;padding:6px 12px;font-weight:800;font-size:14px;text-align:center;max-width:100%;box-sizing:border-box;line-height:1.3}
#goal b{color:var(--gold)}
#goal small{display:block;font-size:13px;font-weight:700;color:#d6e6c6;margin-top:1px}
#goal small.wxl{color:#bfefff}
.buy.sure{background:var(--red);color:#fff;box-shadow:0 4px 0 #8f2a20}
#goal .coin{width:.8em;height:.8em}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);
  padding:14px max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;max-height:52%;overflow-y:auto;box-sizing:border-box}
#sheet h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;display:flex;justify-content:space-between;align-items:center}
#sheet h3 span{font-family:var(--f-body);font-size:16px;font-weight:900}
.sec{font-family:var(--f-display);font-size:19px;margin-top:6px}
.note{display:block;font-size:13px;color:var(--muted);font-weight:700}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(35,48,31,.1)}
.up div{min-width:0}
.up strong{display:block;font-size:16px}
.up small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 6px}
.pill{font-family:var(--f-body);font-weight:900;font-size:13px;padding:6px 10px;border-radius:999px;background:#efe6cf;color:var(--ink);box-shadow:0 2px 0 #cbbf9f}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:3px;vertical-align:-.05em;margin-right:.35em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.bar{display:inline-block;width:64px;height:7px;border-radius:4px;background:#e3dcc8;vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint)}
button{font-family:var(--f-display);border:0;cursor:pointer;transition:transform .08s}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid #1e6fd9;outline-offset:3px}
.buy{flex:none;min-width:86px;font-size:17px;padding:8px 12px;border-radius:12px;background:var(--mint);color:#0d3b26;box-shadow:0 4px 0 #23935f}
.buy.sm{min-width:0;font-size:14px;padding:7px 10px}
.buy:disabled{background:#d9d4c4;color:#8d8778;box-shadow:0 4px 0 #b9b3a2;cursor:default;transform:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(20,60,80,.45);box-sizing:border-box}
.card{width:100%;max-width:350px;margin:auto;background:var(--paper);border-radius:22px;padding:22px 18px;box-sizing:border-box;text-align:center;
  display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 10px 0 rgba(35,48,31,.2),0 20px 40px rgba(0,0,0,.25)}
.card h2{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;color:#e2902b;text-shadow:0 3px 0 #8a4d12}
.logo{font-family:var(--f-display);font-weight:400;font-size:52px;line-height:.95;margin:0;color:#e2902b;text-shadow:0 4px 0 #8a4d12}
.logo span{display:block;color:#3c9b4c;text-shadow:0 4px 0 #1f5c2a}
.how{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;text-align:left;font-weight:700;font-size:14.5px;line-height:1.3;width:100%}
.how b{font-family:var(--f-display);font-weight:400;color:#e2902b;font-size:16.5px}
.big{font-size:26px;padding:12px 40px;border-radius:16px;background:#e2902b;color:#fff;box-shadow:0 6px 0 #8a4d12}
.ghost{font-size:16px;padding:8px 16px;border-radius:12px;background:#efe6cf;color:var(--ink);box-shadow:0 3px 0 #cbbf9f;display:inline-flex;align-items:center;gap:6px}
.ghost svg{width:18px;height:18px}
.small{margin:0;font-size:14px;color:var(--muted);font-weight:700}
.ver{margin:0;font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.02em}
.earn{font-family:var(--f-display);font-size:46px;color:#d99a12;text-shadow:0 3px 0 rgba(35,48,31,.18);line-height:1}
.made{font-weight:800;font-size:15px;line-height:1.45;margin:0}
.opts{width:100%;display:flex;flex-direction:column;gap:2px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-top:1px solid rgba(35,48,31,.1);font-weight:900;font-size:17px}
.tog{min-width:92px;font-size:17px;padding:7px 12px;border-radius:12px;background:var(--mint);color:#0d3b26;box-shadow:0 4px 0 #23935f}
.tog.off{background:#d9d4c4;color:#6d6758;box-shadow:0 4px 0 #b9b3a2}
.danger{font-size:16px;padding:9px 14px;border-radius:12px;background:#f3d5cf;color:#9b2a1f;box-shadow:0 3px 0 #d9a79d}
.danger.sure{background:var(--red);color:#fff;box-shadow:0 3px 0 #8f2a20}
.news{width:100%;text-align:left;background:#f3ead3;border-radius:14px;padding:10px 14px;box-sizing:border-box;font-size:14px;font-weight:700;line-height:1.35}
.news b{font-family:var(--f-display);font-weight:400;font-size:17px;color:#e2902b}
.news ul{margin:4px 0 0;padding-left:18px}
#blast{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(26px,calc(env(safe-area-inset-bottom,0px) + 14px));width:66px;height:66px;border-radius:50%;color:#fff;font-family:var(--f-display);font-size:28px;line-height:1;padding:0;
  background-image:conic-gradient(rgba(25,25,25,.55) var(--p,0%),rgba(0,0,0,0) 0),radial-gradient(circle at 35% 30%,#ffb35c,#e2483f 72%);box-shadow:0 5px 0 #8f2a20,0 8px 18px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.35)}
#blast:disabled{box-shadow:0 5px 0 #6d4a44;cursor:default}
#blast.ready{animation:pulse 1.2s ease-in-out infinite}
#blast small{display:block;font-size:11px;font-family:var(--f-body);font-weight:900;margin-top:2px}
@keyframes pulse{50%{transform:scale(1.07)}}
#lagerBtn{pointer-events:auto;border:0;font-family:var(--f-body);color:var(--ink);cursor:pointer}
#lagerBtn.full{background:#ffd9d2;color:#b3261e}
#lagerBtn.warn{color:#9b2a1f}
.tabs{display:flex;gap:6px;position:sticky;top:-14px;background:var(--paper);padding:6px 0 6px;margin-top:-6px;z-index:1}
.tab{flex:1;font-size:15px;padding:8px 4px;border-radius:12px;background:#efe6cf;color:var(--ink);box-shadow:0 3px 0 #cbbf9f;white-space:nowrap}
.tab.on{background:#e2902b;color:#fff;box-shadow:0 3px 0 #8a4d12}
.x{flex:none;width:38px;height:38px;border-radius:50%;background:#efe6cf;color:var(--ink);box-shadow:0 3px 0 #cbbf9f;font-size:20px;line-height:1;padding:0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd h3{flex:1;min-width:0;flex-wrap:wrap;gap:2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.it{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 6px;background:#f3ead3;border-radius:12px;padding:6px 6px 6px 9px;min-width:0}
.it .nm{grid-column:2/4;min-width:0;font-weight:900;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.it .ct{grid-column:1/3;font-size:13px;color:var(--muted);font-weight:800;line-height:1.2}
.it .sw{margin:0}
.it .buy{min-width:0;font-size:13px;padding:6px 8px;box-shadow:0 3px 0 #23935f}
.warnl{background:#ffe3dc;color:#8f2a20;border-radius:12px;padding:7px 10px;font-weight:800;font-size:14px;line-height:1.3}
.okl{background:#e2f6e6;color:#1f6a3a;border-radius:12px;padding:7px 10px;font-weight:800;font-size:14px}
.pt{width:100%;border-collapse:collapse;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.pt td,.pt th{padding:5px 4px;border-top:1px solid rgba(35,48,31,.1);text-align:right;white-space:nowrap}
.pt th{font-size:13px;color:var(--muted);border-top:0}
.pt td:first-child,.pt th:first-child{text-align:left;white-space:normal}
.pt .neg{color:#b3261e}.pt .pos{color:#1f8a4a}.pt tr.bad td{background:#fff0ec}
.rec{display:flex;align-items:center;gap:4px;font-weight:900;font-size:14px;flex-wrap:wrap}
.sw.r{border-radius:50%}
.tabs{flex:none;flex-wrap:wrap}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 28%;min-width:0;padding:8px 6px}
.hrow{display:grid;grid-template-columns:46px 1fr;gap:2px 10px;align-items:center;padding:8px 0 4px;border-top:1px solid rgba(35,48,31,.1)}
.hrow img{width:46px;height:46px;border-radius:12px;background:#f3ead3;grid-row:span 2}
.hrow strong{font-size:16px;line-height:1.15}
.hrow small{display:block;font-size:13px;color:var(--muted);font-weight:800;line-height:1.3}
.lvb{display:inline-block;width:56px;height:7px;border-radius:4px;background:#e3dcc8;vertical-align:middle;margin:0 4px;overflow:hidden}
.lvb i{display:block;height:100%;background:#e2902b}
.trait{display:inline-block;font-size:12.5px;font-weight:900;padding:2px 7px;border-radius:999px;background:#e2f6e6;color:#1f6a3a;margin:3px 4px 0 0}
.trait.food{background:#fff3cf;color:#7a5a12}.trait.hungry{background:#ffe3dc;color:#8f2a20}
.pill.on{background:#e2902b;color:#fff;box-shadow:0 2px 0 #8a4d12}
.pbar{height:9px;border-radius:5px;background:#e3dcc8;overflow:hidden;margin-top:3px}.pbar i{display:block;height:100%;background:var(--mint)}
.req{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-weight:800;font-size:14px;align-items:center}
.req .ok{color:#1f8a4a}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.coll div{background:#f3ead3;border-radius:10px;padding:5px 3px;text-align:center;font-size:12px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.coll img{width:34px;height:34px;display:block;margin:0 auto 2px}
.coll .no{opacity:.4}.coll .no img{filter:grayscale(1) brightness(.6)}
.optc{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:6px 2px;border-top:1px solid rgba(35,48,31,.1);font-weight:900;font-size:16px;text-align:left}
.optc label{display:flex;justify-content:space-between}
.sld{width:100%;accent-color:#e2902b;height:26px;margin:0}
#fade{position:absolute;inset:0;background:#08060e;pointer-events:none;opacity:0}
@media (max-width:400px){.chip{font-size:15px;padding:5px 9px}.row{gap:6px}}
@media (max-width:350px){.chip{font-size:14px;padding:4px 7px}#saved{display:none}.tab{min-width:0;padding:8px 7px;font-size:14px}}
.ts{display:none}@media (max-width:370px){.tl{display:none}.ts{display:inline}}
@media (min-width:360px){.tabs.n7 .tab{flex-basis:22%;padding:8px 3px}.tabs.n7 .tl{display:none}.tabs.n7 .ts{display:inline}}
@media (prefers-reduced-motion:reduce){#blast.ready{animation:none}button{transition:none}.chip.bump{animation:none}#saved{transition:none}}
/* 4.3: Tippflächen mindestens 44 px, ein Bauteil-Satz für alle Bögen */
#sheet button,#hud button,.card button{min-height:44px;min-width:44px;box-sizing:border-box}
.pill{padding:8px 12px;font-size:14px}.it .buy{min-width:56px;padding:6px 8px}
#gear,.x{width:44px;height:44px}#lagerBtn{padding:5px 12px}
.buy:disabled,.buy[aria-disabled="true"]{pointer-events:none}
.up.why{cursor:pointer}
@media (max-width:400px){#saved .svt{display:none}#saved{font-size:16px}}
#saved.fail{display:block!important;opacity:1;color:#fff;background:#d9483b;border-radius:999px;padding:4px 10px;flex:none;text-shadow:none}
#toast{position:absolute;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 14px));transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;background:rgba(35,48,31,.9);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
.sup{display:block;font-size:13px;color:#1f6a3a;font-weight:800;margin-top:2px}
.bufl{display:flex;flex-wrap:wrap;gap:4px 10px;font-weight:800;font-size:14px}
details.news summary,details.how2 summary{cursor:pointer;font-family:var(--f-display);font-size:17px;color:#e2902b;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;list-style:none}
details.news summary::-webkit-details-marker,details.how2 summary::-webkit-details-marker{display:none}
details.news[open] summary{justify-content:flex-start}
details.how2{width:100%}details.how2 .how{margin-top:6px}
.xfer{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.xfer textarea{width:100%;box-sizing:border-box;min-height:84px;border-radius:12px;border:2px solid #cbbf9f;background:#fff;padding:8px;font:13px/1.3 ui-monospace,Menlo,monospace;color:var(--ink);resize:vertical;-webkit-user-select:text;user-select:text}
.xfer .row2{display:flex;gap:8px;flex-wrap:wrap}.xfer .row2 button{flex:1 1 40%}
.xfer .msg{font-weight:800;font-size:14px;line-height:1.35}.xfer .msg.bad{color:#9b2a1f}.xfer .msg.ok{color:#1f6a3a}
#back.stick{position:sticky;bottom:max(6px,env(safe-area-inset-bottom,0px));z-index:2}
.appt{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#3c9b4c;color:#fff;font-size:11px;vertical-align:1px}
/* 4.4: Uhr und Jahreszeit unter dem Ziel (antippen: mehr dazu) */
#clock{pointer-events:auto;align-self:flex-start;background:none;border:0;padding:0 2px;margin-top:-10px;display:flex;align-items:center;font-family:var(--f-body);color:var(--ink);cursor:pointer}
#clock .clk{font-size:13px;padding:3px 10px;background:rgba(255,248,232,.86);box-shadow:0 2px 0 rgba(35,48,31,.2)}
@media (max-width:350px){#clock .clk{font-size:12px;padding:3px 8px}}
@media (max-height:620px){.logo{font-size:40px}.how{font-size:13.5px;gap:5px 10px}.card{gap:9px;padding:16px 16px}.big{font-size:23px;padding:10px 32px}}
@media (max-width:350px){#lagerBtn{padding:4px 8px}}
</style>
</head>

<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="row"><div class="chip" id="coins"><span class="coin"></span>0</div><div id="saved" role="status" aria-label="Gespeichert">✓<span class="svt"> Gespeichert</span></div><div class="chip" id="bag">🎒 0/20</div><button class="chip" id="lagerBtn" hidden aria-label="Lager und Produktion">📦 0</button>
      <button id="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="4.5" stroke-dasharray="3.1 3.2"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2.8"/></svg></button></div>
    <div id="goal"></div>

  </div>

  <div id="fade"></div>
  <div id="sheet" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="ov"><div class="card" id="card"></div></div>
</div>

<script>
(() => {

const cv = $('cv'), ctx = cv.getContext('2d');

const FONT = '"Lilita One","Arial Black",system-ui,sans-serif';
const HOME_KEY = 'schuerfland-save', MKEY = 'schuerfland-meta', SKEY = 'schuerfland-settings', VERSION = '4.4.1', SAVE_V = 4.4;
const toastEl = $('toast');

    <small class="note">Für die App oder ein anderes Gerät: Code kopieren und dort bei „Code einfügen“ einsetzen. Alle Inseln und Einstellungen kommen mit.</small>
    <div class="row2"><button class="ghost" id="xcopy">Code kopieren</button><button class="ghost" id="xpaste">Code einfügen</button></div>
    <button class="ghost" id="xshare" hidden>Als Datei teilen</button>
    <textarea id="xcode" hidden spellcheck="false" autocomplete="off" aria-label="Spielstand-Code"></textarea>
    <div class="msg" id="xmsg" role="status" aria-live="polite"></div>
    <button class="danger" id="xload" hidden>Laden</button>
  </div></details>`;
}
function xferWire() {
  const ta = $('xcode'), msg = $('xmsg'), ld = $('xload'), sh = $('xshare');
  if (!ta) return;
  let armed = null, code = '';
  const say2 = (t, cls) => { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); };
  const disarm = () => { armed = null; ld.classList.remove('sure'); ld.textContent = 'Laden'; };
  const fileOk = () => { try { return !!(navigator.canShare && typeof File === 'function' && navigator.canShare({ files: [new File(['x'], 'x.txt', { type: 'text/plain' })] })); } catch (e) { return false; } };
  $('xcopy').onclick = () => {
    if (state === 'settings' && returnTo === 'play') save(true); saveMeta();
    try { code = sflEncode(); } catch (e) { say2('Der Code konnte nicht erstellt werden.', 'bad'); return; }
    ta.hidden = false; ta.readOnly = true; ta.value = code; ld.hidden = true; disarm(); sh.hidden = !fileOk();
    const shown = () => { try { ta.focus(); ta.select(); ta.setSelectionRange(0, code.length); } catch (e) {} };
    let p = null; try { p = navigator.clipboard && navigator.clipboard.writeText(code); } catch (e) { p = null; }
    if (p && p.then) p.then(() => say2('Code kopiert (' + fmt(code.length) + ' Zeichen). In der App bei „Code einfügen“ einsetzen.', 'ok'), () => { shown(); say2('Kopieren ging nicht automatisch: der Code ist markiert, bitte selbst kopieren.', ''); });
    else { shown(); say2('Der Code ist markiert: bitte selbst kopieren.', ''); }
    sfx('tap');
  };
  sh.onclick = () => { try { const f = new File([code || sflEncode()], 'schuerfland-spielstand.txt', { type: 'text/plain' }); const p = navigator.share({ files: [f], title: 'Schürfland Spielstand' }); if (p && p.catch) p.catch(() => {}); } catch (e) { say2('Teilen geht hier nicht. Bitte den Code kopieren.', 'bad'); } };
  $('xpaste').onclick = () => { ta.hidden = false; ta.readOnly = false; ta.value = ''; ld.hidden = false; sh.hidden = true; disarm(); say2('Code hier einfügen, dann „Laden“.', ''); try { ta.focus(); } catch (e) {} };
  ta.oninput = () => { if (!ta.readOnly) { disarm(); say2('', ''); } };
  ld.onclick = () => {
    const dec = sflDecode(ta.value);
    if (dec.err) { disarm(); say2(dec.err, 'bad'); sfx('warn'); return; }
    if (armed !== ta.value) { armed = ta.value; ld.classList.add('sure'); ld.textContent = 'Wirklich laden? Nochmal tippen'; say2('Gefunden: ' + sflSummary(dec) + '. Dein jetziger Stand wird ersetzt (eine Sicherung bleibt im Speicher).', ''); return; }
    const e = sflApply(dec);
    if (e) { disarm(); say2(e, 'bad'); return; }
    say2('Wird geladen …', 'ok');
  };
}

// ---------- Karten: Menü, Einstellungen, Willkommen ----------
let returnTo = 'menu';
function showCard(html) { ov.hidden = false; hud.hidden = true; blastEl.hidden = true; sheet.hidden = true; sheetMode = null; sheetKey = ''; inp.id = null; card.innerHTML = html; ov.scrollTop = 0; }
function start() {
  initAudio();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  S.started = true; state = 'play'; ov.hidden = true; hud.hidden = false; lastHud = ''; updateHud(true);
  last = performance.now(); save(false);
  if (!S.done.lager && !(S.paid.lager && S.paid.lager.holz)) banner = ISL ? { a: 'Willkommen: ' + ISL.name + '!', b: 'Neue Insel: erst Holz fürs Lager sammeln', life: 3.6, age: 0 } : { a: 'Willkommen!', b: 'Sammle Holz für das Lager im Dorf', life: 3.2, age: 0 };
}
const verTxt = () => `Version ${VERSION}${APP ? '<span class="appt">App</span>' : ''}`;
function showMenu() {
  state = 'menu';
  const cont = S.started;
  showCard(`
    <h1 class="logo">Schürf<span>land</span></h1>
    ${ISL ? `<p class="small">⛵ ${ISL.name} · ${THEMES[ISL.theme].name}</p>` : META.islands.length ? '<p class="small">🏠 Heimatinsel</p>' : ''}
    <div class="how">
      <b>Laufen</b><span>Finger auf den Bildschirm und ziehen.</span>
      <b>Sammeln</b><span>Neben Bäume und Felsen stellen: du arbeitest von allein.</span>
      <b>Bauen</b><span>Auf weiße Bauplätze stellen. Der Pfeil zeigt immer den nächsten Schritt.</span>
    </div>
    <button class="big" id="go">${cont ? 'Weiterspielen' : 'Los geht’s'}</button>
    <details class="how2"><summary>So geht’s ▾</summary><div class="how">
      <b>Lager</b><span>Im Dorf auf die Rampe stellen: der ganze Rucksack wandert hinein.</span>
      <b>Verkaufen</b><span>Am Stand „Verkaufen“ gibt es Münzen für alles im Rucksack.</span>
      <b>Werkbank</b><span>Werkzeug, Rucksack, Transport und Helfer kaufen.</span>
      <b>Helfer</b><span>Sammeln und tragen: Holz zur Säge, Erz zum Ofen, Waren zum Bauplatz.</span>
      <b>Maschinen</b><span>Nehmen vom Stapel davor, sonst aus dem Lager. Ihr Arbeiter macht sie schnell.</span>
      <b>Tiefe</b><span>In der Mine führt ein Schacht hinab: Etage für Etage.</span>
      <b>📦</b><span>Oben antippen: Lager, Produktion, Helfer und Dorf.</span>
    </div></details>
    <button class="ghost" id="opt">${GEAR}Einstellungen</button>
    <p class="ver">${verTxt()}</p>`);
  $('go').onclick = start;
  $('opt').onclick = () => showSettings('menu');
}
function showSettings(from) {
  returnTo = from; state = 'settings';
  const tg = (k, on, a, b) => `<button class="tog${on ? '' : ' off'}" data-set="${k}">${on ? a : b}</button>`;
  showCard(`
    <h2>Einstellungen</h2>
    <div class="opts">
      <div class="opt"><span>Ton</span>${tg('sound', SET.sound, 'An', 'Aus')}</div>
      ${[['sfx', 'Effekte'], ['amb', 'Umgebung'], ['mus', 'Musik']].map(([k, n]) => `<div class="optc"><label for="v-${k}"><span>${n}</span><span id="v-${k}-n">${Math.round(SET[k] * 100)} %</span></label><input type="range" class="sld" id="v-${k}" data-vol="${k}" min="0" max="100" step="5" value="${Math.round(SET[k] * 100)}" aria-label="${n} Lautstärke"></div>`).join('')}
      <div class="opt"><span>Vibration</span>${tg('vib', SET.vib, 'An', 'Aus')}</div>
      <div class="opt"><span>Grafik</span>${tg('gfx', !LOW(), 'Hoch', 'Niedrig')}</div>
      <div class="opt"><span>Wetter</span>${tg('wetter', SET.wetter, 'An', 'Aus')}</div>
      <div class="opt"><span>Tag/Nacht</span>${tg('tagnacht', tagOn(), 'An', 'Aus')}</div>
      <div class="opt"><span>Jahreszeiten</span>${tg('jahr', jahrOn(), 'An', 'Aus')}</div>
      <div class="opt"><span>Bewegung reduzieren</span>${tg('calm', !!SET.calm, 'An', 'Aus')}</div>
    </div>
    <button class="big stick" id="back">${from === 'play' ? 'Weiter' : 'Zurück'}</button>
    ${xferHtml()}
    <details class="news"><summary>Neu in ${VERSION} ▾</summary><ul>
      <li>4.4.1: Test-Update – dein Spielstand bleibt beim Aktualisieren vollständig erhalten</li>
      <li>Tag und Nacht: Morgenrot, goldene Stunde, Nächte mit Laternen, Fensterlicht, Glühwürmchen und Leuchtturm</li>
      <li>Jahreszeiten: Blüten im Frühling, buntes Laub im Herbst, Schnee im Winter, sanft spürbar beim Wachsen und Ernten</li>
      <li>Bäume fallen um, Felsen zerspringen, Spuren in Sand und Schnee, Rauch aus den Schornsteinen, Wind in den Kronen</li>
      <li>Natürlichere Grafik: Wiesen, Wege, Pflaster, Wasser, Bäume, Häuser und Figuren</li>
      <li>Neue Klänge: Bäume krachen, Steine splittern, Grillen und Eulen in der Nacht, Winterwind</li>
      <li>Uhr und Jahreszeit oben (antippen) · Tag/Nacht und Jahreszeiten in den Einstellungen</li>
      <li>Leistungsautomatik: Ruckelt es auf einem langsamen Gerät, spart das Spiel von selbst an Zierde und Auflösung, bis es wieder flüssig läuft</li>
      <li>Aus 4.3: sichtbare Logistik, Transport, Arbeiter · aus 4.2: Inseln, Wetter · aus 4.1: Forschung, Strom, Handel · aus 4.0: Tiefenmine, Ackerland</li>
    </ul></details>
    <button class="danger" id="reset">${ISL ? 'Diese Insel neu beginnen' : 'Spielstand zurücksetzen'}</button>
    <p class="ver">${verTxt()}</p>`);
  card.querySelectorAll('.sld').forEach(el => el.oninput = () => { const k = el.dataset.vol; SET[k] = vol01(el.value / 100, SET[k]); const n = $('v-' + k + '-n'); if (n) n.textContent = el.value + ' %'; saveSet(); if (k === 'sfx') { initAudio(); sfx('tap'); } audioVol(); });
  card.querySelectorAll('.tog').forEach(b => b.onclick = () => {
    const k = b.dataset.set;
    if (k === 'gfx') { SET.gfx = LOW() ? 'hoch' : 'niedrig'; resize(); flushChunks(); SPR.clear(); PFX.setQuality(LOW() || LITE ? 'low' : 'high'); }
    else SET[k] = !SET[k];
    saveSet();
    if (k === 'gfx' || k === 'calm' || k === 'tagnacht' || k === 'jahr') { dnView(); PFX.setReducedMotion(CALM()); lastHud = ''; }
    if (k === 'sound' && SET.sound) { initAudio(); sfx('tap'); }
    if (k === 'vib' && SET.vib) vib(30);
    const on = k === 'gfx' ? !LOW() : SET[k];
    b.classList.toggle('off', !on); b.textContent = k === 'gfx' ? (on ? 'Hoch' : 'Niedrig') : (on ? 'An' : 'Aus');
  });
  xferWire();
  const r = $('reset');
  r.onclick = () => {
    if (r.dataset.sure) { try { localStorage.removeItem(KEY); localStorage.removeItem(PKEY); } catch (e) {} resetting = true; location.reload(); }
    else { r.dataset.sure = '1'; r.classList.add('sure'); r.textContent = ISL ? 'Wirklich? Die Insel beginnt neu. Nochmal tippen' : META.islands.length ? 'Wirklich? Die Heimatinsel beginnt neu. Nochmal tippen' : 'Wirklich? Alles geht verloren. Nochmal tippen'; }
  };
  $('back').onclick = () => { if (returnTo === 'play') start(); else showMenu(); };
}
gearEl.onclick = () => { if (state === 'play') { save(true); showSettings('play'); } };
function dur(sec) { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? h + ' Std ' + m + ' Min' : Math.max(1, m) + ' Min'; }
function showWelcome(r) {
  state = 'welcome';
  const made = Object.keys(r.made).sort((a, b) => r.made[b] * RES[b].price - r.made[a] * RES[a].price).slice(0, 5).map(k => `${fmt(r.made[k])} ${RES[k].name}`);
  if (r.sold) made.push(`${fmt(r.sold)} Waren verkauft`);
  const ate = Object.values(r.ate || {}).reduce((a, b) => a + b, 0); if (ate) made.push(`${fmt(ate)} Mahlzeiten gegessen`);
  if (r.smith) made.push('Der Schmied hat Werkzeug verbessert');
  showCard(`
    <h2>Willkommen zurück!</h2>
    <p class="small">Du warst ${dur(r.sec)} weg${r.capped ? ' (gezählt werden höchstens 2 Std)' : ''}.</p>
    <div class="earn">${coinH}+${fmt(r.coins)}</div>
    <p class="small">Helfer, Sammler und Maschinen haben weitergearbeitet.</p>
    ${made.length ? `<p class="made">${made.join('<br>')}</p>` : ''}
    <button class="big" id="go">Einsammeln</button>
    <button class="ghost" id="menu">Zum Menü</button>`);
  $('go').onclick = () => { sfx('coinbig'); start(); popCoins(pl.x, pl.y - 60, r.coins); };
  $('menu').onclick = showMenu;
}
let hiddenAt = 0, resetting = false;
document.addEventListener('visibilitychange', () => {
  if (resetting) return;
  if (document.hidden) { hiddenAt = Date.now(); save(false); try { SND.suspend(); } catch (e) {} }
  else {
    last = performance.now(); try { if (SET.sound) SND.resume(); } catch (e) {}
    if (hiddenAt && state === 'play') { const r = offlineCalc((Date.now() - hiddenAt) / 1000); if (r && r.any) { save(false); showWelcome(r); } }
    hiddenAt = 0;
  }
});
window.addEventListener('pagehide', () => { if (!resetting) save(false); });

// ---------- Start ----------
resize();
for (const c of S.helpers) spawnHelper(c);
for (const c of S.ops) spawnOp(c);
fillQuests(); computeNeeds();
booted = true;   // ab hier darf gespeichert werden
if (metaFix) saveMeta();
if (!walkable(pl.x, pl.y, 10)) { pl.x = START.x; pl.y = START.y; }
camX = pl.x; camY = pl.y;
const off = S.started && S.lastSeen > 0 ? offlineCalc((Date.now() - S.lastSeen) / 1000) : null;
if (off && off.any) { save(false); showWelcome(off); } else showMenu();
if (S.deep.at > 0 && S.done.schacht) setFloor(Math.min(S.deep.at, S.deep.max));
requestAnimationFrame(loop);
// App-Hülle: Bescheid geben, dass das Spiel bereit ist
if (APP && typeof APP.onReady === 'function') { try { APP.onReady({ version: VERSION, key: KEY }); } catch (e) {} }
})();

  // Hintergrund des Rahmens an das Spiel anpassen (sichtbar hinter der Statusleiste)
  try { document.documentElement.style.background = getComputedStyle(document.body).backgroundColor; } catch (e) {}
  // Offline-Speicher
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
  // Hinweis zum Installieren auf dem iPhone (nur im Safari-Browser, nicht in der installierten App)
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  var seen = false; try { seen = localStorage.getItem('sfl-install-hint') === '1'; } catch (e) {}
  if (ios && !window.SFL_APP.standalone && !seen) {
    setTimeout(function () {
      var d = document.createElement('div'); d.id = 'sfl-install';
      d.innerHTML = '<span>Als App installieren: unten auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>.</span><button type="button" aria-label="Hinweis schließen">OK</button>';
      d.querySelector('button').onclick = function () { d.remove(); try { localStorage.setItem('sfl-install-hint', '1'); } catch (e) {} };
      document.body.appendChild(d);
    }, 1500);
  }
})();
