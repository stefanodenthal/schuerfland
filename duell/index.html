button{font:inherit;color:inherit;touch-action:none}
[hidden]{display:none!important}

.p1{border-top:3px solid #2f7be0}
.p2{border-top:3px solid #f08a24;transform:rotate(180deg)}

.pips i{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}

.bar i{position:absolute;inset:0;transform-origin:left;border-radius:7px;background:#4cd37b}
.bar.hp{flex:1}.bar.hp i.mid{background:#f2c33d}.bar.hp i.low{background:#ec4a3c}

.bar.heat.over{animation:blink .3s steps(2) infinite}
.bar.heat b{position:absolute;inset:0;font:800 9px/12px system-ui;text-align:center;letter-spacing:.06em;text-shadow:0 0 3px #000}

.chips span{padding:0 5px;border-radius:6px;background:rgba(255,255,255,.18)}

.pad div{display:flex;align-items:center;justify-content:center;border-radius:20px;transition:background .06s}
.p1 .pad div.on{background:rgba(47,123,224,.65)}.p2 .pad div.on{background:rgba(240,138,36,.65)}
.btn{position:relative;overflow:hidden;border:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:800 10px/1 system-ui;letter-spacing:.05em;background:linear-gradient(#41659a,#27446f);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 3px 0 rgba(0,0,0,.4);touch-action:none;padding:0}
.btn.on{transform:translateY(2px);filter:brightness(1.35);box-shadow:inset 0 2px 0 rgba(255,255,255,.22)}
.btn.fire{grid-area:fire;background:linear-gradient(#e2574a,#a62b2b);font-size:12px}
.btn.fire.off{filter:grayscale(.7) brightness(.7)}
.btn.miss{grid-area:miss}.btn.roll{grid-area:roll}
.btn.dis{opacity:.45}
.btn svg,.pad svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.btn.fire svg{width:44px;height:44px}
.btn .cd{position:absolute;left:0;right:0;bottom:0;height:100%;background:rgba(0,0,0,.5);transform-origin:bottom;transform:scaleY(0);pointer-events:none}
.btn .cnt{position:absolute;top:4px;right:7px;font:900 13px system-ui;color:#ffd24a}
.btn span{pointer-events:none}
.aimask{position:absolute;inset:0;z-index:3;background:rgba(7,25,47,.86);display:none;align-items:center;justify-content:center;font:900 24px system-ui;letter-spacing:.1em;color:#f08a24}
.side.ai .aimask{display:flex}
#arena{position:relative;min-height:0;overflow:hidden;background:#0a3a63}
#stage{position:absolute;inset:0}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}

#pause i{width:5px;height:18px;border-radius:2px;background:#fff}

.ob:active{transform:translateY(2px)}
#menu{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 18px max(10px,env(safe-area-inset-bottom));background:radial-gradient(120% 90% at 50% 20%,#14609a 0,#0a2f55 50%,#051326 100%)}
#menu .in{width:100%;max-width:360px;display:flex;flex-direction:column;gap:9px;align-items:stretch}
#logo{width:100%;max-width:340px;height:auto;align-self:center;aspect-ratio:340/110}
#menu h1{margin:0;text-align:center;font:900 clamp(34px,11vw,46px)/1 system-ui;letter-spacing:.03em;text-shadow:0 3px 0 #0a2f55,0 0 18px rgba(120,200,255,.5)}
#menu .tag{text-align:center;opacity:.85;font-size:14px}
#menu .go{min-height:64px;border:0;border-radius:20px;font:900 20px system-ui;color:#fff;background:linear-gradient(#e2574a,#a62b2b);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 rgba(0,0,0,.4);touch-action:manipulation}

#menu .how{font-size:12.5px;text-align:center;opacity:.78;line-height:1.35}

 .p1,.p2{border-top:0;transform:none}
 .p1{border-right:3px solid #2f7be0}.p2{border-left:3px solid #f08a24}

.flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle,rgba(255,60,40,0) 40%,rgba(255,60,40,.55) 100%);opacity:0}
.flash.f{animation:fl .28s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
